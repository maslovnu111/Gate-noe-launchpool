name: Gate Launchpool Monitor

on:
  schedule:
    - cron: "*/10 * * * *"   # кожні 10 хвилин (час UTC)
  workflow_dispatch:          # кнопка "Run workflow" для запуску вручну

permissions:
  contents: write             # потрібно, щоб бот зберігав файл пам'яті назад у репозиторій

concurrency:
  group: gate-launchpool      # не дає двом запускам виконуватись одночасно
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10       # запобіжник від зависань
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_launchpools.py

      - name: Commit state if changed
        run: |
          if [[ -z "$(git status --porcelain seen_gate_launchpools.json)" ]]; then
            echo "Змін у файлі пам'яті немає — комітити нічого."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_gate_launchpools.json
          git commit -m "Update seen Gate launchpools [skip ci]"
          # Надійний push: якщо віддалена гілка зрушила — підтягуємо (rebase) і повторюємо.
          pushed=false
          for i in 1 2 3 4 5; do
            if git push; then
              pushed=true
              break
            fi
            echo "Push не вдався, синхронізуюся і повторюю (спроба $i)…"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $((i * 2))
          done
          if [[ "$pushed" != "true" ]]; then
            echo "::error::Не вдалося запушити файл пам'яті після кількох спроб."
            exit 1
          fi
